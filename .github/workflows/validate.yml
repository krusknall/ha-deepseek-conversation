name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          pip install pytest-homeassistant-custom-component ruff
          pip install hassil home-assistant-intents home-assistant-frontend \
            SQLAlchemy fnv-hash-fast psutil-home-assistant mutagen \
            pymicro-vad pyspeex-noise gazetteer-matcher
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
